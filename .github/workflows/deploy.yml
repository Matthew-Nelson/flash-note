name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/flashnote/flashnote

jobs:
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    permissions:
      contents: read
      id-token: write

    outputs:
      image_tag: ${{ github.event.workflow_run.head_sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build Docker image
        run: |
          docker build --platform linux/amd64 \
            -t ${{ env.IMAGE }}:${{ github.event.workflow_run.head_sha }} \
            -t ${{ env.IMAGE }}:latest .

      - name: Push Docker image
        run: |
          docker push ${{ env.IMAGE }}:${{ github.event.workflow_run.head_sha }}
          docker push ${{ env.IMAGE }}:latest

  deploy-staging:
    name: Deploy to Staging
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    environment: staging

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Run database migrations
        run: |
          gcloud run jobs update flashnote-migrate \
            --image=${{ env.IMAGE }}:${{ needs.build.outputs.image_tag }} \
            --region=${{ secrets.GCP_REGION }} \
            --project=${{ secrets.GCP_PROJECT_ID }}
          gcloud run jobs execute flashnote-migrate \
            --region=${{ secrets.GCP_REGION }} \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --wait

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy flashnote \
            --image=${{ env.IMAGE }}:${{ needs.build.outputs.image_tag }} \
            --region=${{ secrets.GCP_REGION }} \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --service-account=${{ secrets.GCP_SA_RUNTIME_EMAIL }} \
            --memory=1Gi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=5 \
            --port=3000 \
            --startup-probe-path=/api/health \
            --liveness-probe-path=/api/health \
            --ingress=internal-and-cloud-load-balancing \
            --set-env-vars="NODE_ENV=production,DEPLOY_VERSION=${{ needs.build.outputs.image_tag }},WEB_URL=https://staging.flashnote.co,LLM_PROVIDER=gemini,GEMINI_USE_ADC=true,GEMINI_API_URL=https://${{ secrets.GCP_REGION }}-aiplatform.googleapis.com/v1/projects/${{ secrets.GCP_PROJECT_ID }}/locations/${{ secrets.GCP_REGION }}/publishers/google,GEMINI_MODEL=gemini-2.5-flash,TRUSTED_PROXY_COUNT=2,REGISTRATION_MODE=invite"

  deploy-production:
    name: Deploy to Production
    needs: [build, deploy-staging]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    environment: production

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_PROD_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_PROD_SA_EMAIL }}

      - name: Run database migrations
        run: |
          gcloud run jobs update flashnote-migrate \
            --image=${{ env.IMAGE }}:${{ needs.build.outputs.image_tag }} \
            --region=${{ secrets.GCP_REGION }} \
            --project=${{ secrets.GCP_PROD_PROJECT_ID }}
          gcloud run jobs execute flashnote-migrate \
            --region=${{ secrets.GCP_REGION }} \
            --project=${{ secrets.GCP_PROD_PROJECT_ID }} \
            --wait

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy flashnote \
            --image=${{ env.IMAGE }}:${{ needs.build.outputs.image_tag }} \
            --region=${{ secrets.GCP_REGION }} \
            --project=${{ secrets.GCP_PROD_PROJECT_ID }} \
            --service-account=${{ secrets.GCP_PROD_SA_RUNTIME_EMAIL }} \
            --memory=1Gi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=10 \
            --port=3000 \
            --startup-probe-path=/api/health \
            --liveness-probe-path=/api/health \
            --ingress=internal-and-cloud-load-balancing \
            --set-env-vars="NODE_ENV=production,DEPLOY_VERSION=${{ needs.build.outputs.image_tag }},WEB_URL=https://flashnote.co,LLM_PROVIDER=gemini,GEMINI_USE_ADC=true,GEMINI_API_URL=https://${{ secrets.GCP_REGION }}-aiplatform.googleapis.com/v1/projects/${{ secrets.GCP_PROD_PROJECT_ID }}/locations/${{ secrets.GCP_REGION }}/publishers/google,GEMINI_MODEL=gemini-2.5-flash,TRUSTED_PROXY_COUNT=2,REGISTRATION_MODE=invite"

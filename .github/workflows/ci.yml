name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.claude/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.claude/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '10'

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint
        working-directory: ./web

      - name: Test
        run: pnpm test:ci
        working-directory: ./web

      - name: Build
        run: pnpm build
        working-directory: ./web

      - name: Coverage summary
        if: always()
        run: |
          summary_file="./web/coverage/coverage-summary.json"
          echo "## Web Coverage" >> $GITHUB_STEP_SUMMARY
          if [ -f "$summary_file" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Metric | Coverage |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|----------|" >> $GITHUB_STEP_SUMMARY
            for metric in lines branches functions statements; do
              pct=$(jq -r ".total.${metric}.pct" "$summary_file")
              echo "| ${metric^} | ${pct}% |" >> $GITHUB_STEP_SUMMARY
            done
          else
            echo "Coverage summary not available" >> $GITHUB_STEP_SUMMARY
          fi

      # Advisory-only — results appear in workflow logs but won't fail CI.
      # We don't block deploys on transitive dependency vulnerabilities
      # we can't immediately fix.
      - name: Security audit
        run: pnpm audit --audit-level=high
        working-directory: ./web
        continue-on-error: true

  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    permissions:
      contents: read
      id-token: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Check for infra changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            infra:
              - 'infra/**'

      - name: Setup Terraform
        if: steps.filter.outputs.infra == 'true'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.14"

      - name: Authenticate to Google Cloud
        if: steps.filter.outputs.infra == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Terraform Init
        if: steps.filter.outputs.infra == 'true'
        run: terraform -chdir=infra init -backend-config="bucket=flashnote-terraform-state" -backend-config="prefix=staging"

      - name: Terraform Plan
        if: steps.filter.outputs.infra == 'true'
        id: plan
        run: terraform -chdir=infra plan -var-file=staging.tfvars -no-color -out=tfplan
        continue-on-error: true

      - name: Comment Plan on PR
        if: steps.filter.outputs.infra == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PLAN_OUTPUT: ${{ steps.plan.outputs.stdout }}
        with:
          script: |
            const output = `#### Terraform Plan
            \`\`\`
            ${process.env.PLAN_OUTPUT}
            \`\`\`
            *Triggered by @${{ github.actor }}*`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      - name: Terraform Plan Status
        if: steps.plan.outcome == 'failure'
        run: exit 1

  ci-success:
    name: CI Success
    needs: [web, terraform-plan]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Check required jobs
        run: |
          if [[ "${{ needs.web.result }}" != "success" ]]; then
            echo "Web job failed"
            exit 1
          fi
          if [[ "${{ needs.terraform-plan.result }}" == "failure" ]]; then
            echo "Terraform plan failed"
            exit 1
          fi
          echo "All required checks passed!"

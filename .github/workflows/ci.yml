name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '10'

jobs:
  # Backend tests with coverage
  backend-tests:
    name: Backend Tests & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install
        working-directory: ./backend

      - name: Run linter
        run: pnpm lint
        working-directory: ./backend

      - name: Run tests with coverage
        run: pnpm test:ci
        working-directory: ./backend
        env:
          # Test environment variables (non-sensitive)
          NODE_ENV: production
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          JWT_SECRET: test-jwt-secret-minimum-32-characters-long-for-ci
          JWT_REFRESH_SECRET: test-refresh-secret-minimum-32-characters-long
          CSRF_SECRET: test-csrf-secret-minimum-32-characters-long-ci
          GEMINI_API_KEY: test-gemini-api-key
          STRIPE_SECRET_KEY: sk_test_fake_key_for_ci
          STRIPE_WEBHOOK_SECRET: whsec_test_fake_secret_for_ci

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ./backend/coverage/
          retention-days: 30

      - name: Coverage summary
        run: |
          echo "## Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f ./backend/coverage/coverage-summary.json ]; then
            echo "| Metric | Coverage |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|----------|" >> $GITHUB_STEP_SUMMARY
            lines=$(cat ./backend/coverage/coverage-summary.json | jq -r '.total.lines.pct')
            branches=$(cat ./backend/coverage/coverage-summary.json | jq -r '.total.branches.pct')
            functions=$(cat ./backend/coverage/coverage-summary.json | jq -r '.total.functions.pct')
            statements=$(cat ./backend/coverage/coverage-summary.json | jq -r '.total.statements.pct')
            echo "| Lines | ${lines}% |" >> $GITHUB_STEP_SUMMARY
            echo "| Branches | ${branches}% |" >> $GITHUB_STEP_SUMMARY
            echo "| Functions | ${functions}% |" >> $GITHUB_STEP_SUMMARY
            echo "| Statements | ${statements}% |" >> $GITHUB_STEP_SUMMARY
          else
            echo "Coverage summary not available" >> $GITHUB_STEP_SUMMARY
          fi

  # Backend build verification
  backend-build:
    name: Backend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install
        working-directory: ./backend

      - name: Build
        run: pnpm build
        working-directory: ./backend

  # Extension tests with coverage
  extension-tests:
    name: Extension Tests & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install
        working-directory: ./extension

      - name: Run linter
        run: pnpm lint
        working-directory: ./extension

      - name: Run tests with coverage
        run: pnpm test:ci
        working-directory: ./extension

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: extension-coverage-report
          path: ./extension/coverage/
          retention-days: 30

      - name: Coverage summary
        run: |
          echo "## Extension Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f ./extension/coverage/coverage-summary.json ]; then
            echo "| Metric | Coverage |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|----------|" >> $GITHUB_STEP_SUMMARY
            lines=$(cat ./extension/coverage/coverage-summary.json | jq -r '.total.lines.pct')
            branches=$(cat ./extension/coverage/coverage-summary.json | jq -r '.total.branches.pct')
            functions=$(cat ./extension/coverage/coverage-summary.json | jq -r '.total.functions.pct')
            statements=$(cat ./extension/coverage/coverage-summary.json | jq -r '.total.statements.pct')
            echo "| Lines | ${lines}% |" >> $GITHUB_STEP_SUMMARY
            echo "| Branches | ${branches}% |" >> $GITHUB_STEP_SUMMARY
            echo "| Functions | ${functions}% |" >> $GITHUB_STEP_SUMMARY
            echo "| Statements | ${statements}% |" >> $GITHUB_STEP_SUMMARY
          else
            echo "Coverage summary not available" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Build
        run: pnpm build
        working-directory: ./extension

  # Web tests with coverage
  web-tests:
    name: Web Tests & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install
        working-directory: ./web

      - name: Run linter
        run: pnpm lint
        working-directory: ./web

      - name: Run tests with coverage
        run: pnpm test:ci
        working-directory: ./web

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: web-coverage-report
          path: ./web/coverage/
          retention-days: 30

      - name: Coverage summary
        run: |
          echo "## Web Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f ./web/coverage/coverage-summary.json ]; then
            echo "| Metric | Coverage |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|----------|" >> $GITHUB_STEP_SUMMARY
            lines=$(cat ./web/coverage/coverage-summary.json | jq -r '.total.lines.pct')
            branches=$(cat ./web/coverage/coverage-summary.json | jq -r '.total.branches.pct')
            functions=$(cat ./web/coverage/coverage-summary.json | jq -r '.total.functions.pct')
            statements=$(cat ./web/coverage/coverage-summary.json | jq -r '.total.statements.pct')
            echo "| Lines | ${lines}% |" >> $GITHUB_STEP_SUMMARY
            echo "| Branches | ${branches}% |" >> $GITHUB_STEP_SUMMARY
            echo "| Functions | ${functions}% |" >> $GITHUB_STEP_SUMMARY
            echo "| Statements | ${statements}% |" >> $GITHUB_STEP_SUMMARY
          else
            echo "Coverage summary not available" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Build
        run: pnpm build
        working-directory: ./web
        env:
          # Next.js build requires some env vars
          NEXT_PUBLIC_API_URL: https://api.example.com

  # Security audit
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies (backend)
        run: pnpm install
        working-directory: ./backend

      - name: Run security audit
        run: pnpm audit --audit-level=high
        working-directory: ./backend
        continue-on-error: true  # Don't fail on audit warnings

  # All checks must pass
  ci-success:
    name: CI Success
    needs: [backend-tests, backend-build, extension-tests, web-tests, security-audit]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.backend-tests.result }}" != "success" ]] || \
             [[ "${{ needs.backend-build.result }}" != "success" ]] || \
             [[ "${{ needs.extension-tests.result }}" != "success" ]] || \
             [[ "${{ needs.web-tests.result }}" != "success" ]]; then
            echo "One or more required jobs failed"
            exit 1
          fi
          echo "All required checks passed!"

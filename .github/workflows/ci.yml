name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.claude/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.claude/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '10'

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint
        working-directory: ./web

      - name: Test
        run: pnpm test:ci
        working-directory: ./web

      - name: Build
        run: pnpm build
        working-directory: ./web

      - name: Coverage summary
        if: always()
        run: |
          summary_file="./web/coverage/coverage-summary.json"
          echo "## Web Coverage" >> $GITHUB_STEP_SUMMARY
          if [ -f "$summary_file" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Metric | Coverage |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|----------|" >> $GITHUB_STEP_SUMMARY
            for metric in lines branches functions statements; do
              pct=$(jq -r ".total.${metric}.pct" "$summary_file")
              echo "| ${metric^} | ${pct}% |" >> $GITHUB_STEP_SUMMARY
            done
          else
            echo "Coverage summary not available" >> $GITHUB_STEP_SUMMARY
          fi

      # Advisory-only — results appear in workflow logs but won't fail CI.
      # We don't block deploys on transitive dependency vulnerabilities
      # we can't immediately fix.
      - name: Security audit
        run: pnpm audit --audit-level=high
        working-directory: ./web
        continue-on-error: true

  ci-success:
    name: CI Success
    needs: [web]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Check required jobs
        run: |
          if [[ "${{ needs.web.result }}" != "success" ]]; then
            echo "Web job failed"
            exit 1
          fi
          echo "All required checks passed!"

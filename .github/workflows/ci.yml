name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '10'

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint
        working-directory: ./web

      - name: Test
        run: pnpm test:ci
        working-directory: ./web

      - name: Build
        run: pnpm build
        working-directory: ./web

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-coverage
          path: ./web/coverage/
          retention-days: 30

      - name: Coverage summary
        if: always()
        run: |
          summary_file="./web/coverage/coverage-summary.json"
          echo "## Web Coverage" >> $GITHUB_STEP_SUMMARY
          if [ -f "$summary_file" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Metric | Coverage |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|----------|" >> $GITHUB_STEP_SUMMARY
            for metric in lines branches functions statements; do
              pct=$(jq -r ".total.${metric}.pct" "$summary_file")
              echo "| ${metric^} | ${pct}% |" >> $GITHUB_STEP_SUMMARY
            done
          else
            echo "Coverage summary not available" >> $GITHUB_STEP_SUMMARY
          fi

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit web
        run: pnpm audit --audit-level=high
        working-directory: ./web
        continue-on-error: true

  # security-audit uses continue-on-error: true so it's advisory-only.
  # It's excluded from the ci-success gate intentionally — we review audit
  # results in the workflow summary but don't block deploys on transitive
  # dependency vulnerabilities we can't immediately fix.
  ci-success:
    name: CI Success
    needs: [web]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Check required jobs
        run: |
          if [[ "${{ needs.web.result }}" != "success" ]]; then
            echo "Web job failed"
            exit 1
          fi
          echo "All required checks passed!"

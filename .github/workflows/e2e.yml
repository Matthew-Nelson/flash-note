name: E2E Tests

# Post-merge only: e2e runs on main after a PR lands, plus on demand.
# PRs are gated by the CI workflow (lint, unit tests, build); a failure here
# turns main red rather than blocking the PR.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.claude/**'
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  # Never cancel a running post-merge check; a newer push queues behind it
  cancel-in-progress: false

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '10'

jobs:
  web-e2e:
    name: Web E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        # Matches Cloud SQL (infra/database.tf)
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
        working-directory: ./web

      # Playwright's webServer recreates flashnote_e2e, runs migrations, and
      # starts `next dev` with mock AI and no third-party keys (playwright.config.ts).
      - name: Run E2E tests
        run: pnpm test:e2e
        working-directory: ./web
        env:
          E2E_DATABASE_URL: postgres://test:test@localhost:5432/flashnote_e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: web-playwright-report
          path: web/playwright-report/
          retention-days: 7

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: web-test-results
          path: web/test-results/
          retention-days: 7
